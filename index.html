<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deenu Kataria | Free Online Tools</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
font-family:Arial,sans-serif;
background:#080b12;color:#f5f5f5;line-height:1.6
}
header{
padding:65px 20px 50px;text-align:center;
background:linear-gradient(135deg,#101827,#080b12);
border-bottom:1px solid #202938
}
.logo{font-size:38px;font-weight:bold}
.logo span{color:#00e5ff}
header p{color:#aeb8c8;margin-top:8px}
nav{
position:sticky;top:0;z-index:10;
display:flex;justify-content:center;gap:25px;
padding:15px;background:#080b12;
border-bottom:1px solid #202938
}
nav a{color:#ddd;text-decoration:none;font-weight:bold}
nav a:hover{color:#00e5ff}
.container{max-width:1150px;margin:auto;padding:30px 18px}
.section-title{text-align:center;font-size:30px;margin:20px 0 25px}
.section-title span{color:#00e5ff}
.search-box{max-width:600px;margin:auto auto 35px}
.search-box input{
width:100%;padding:16px 20px;border-radius:14px;
border:1px solid #2a3547;background:#111722;
color:white;outline:none;font-size:16px
}
.tools{
display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px
}
.card{
background:linear-gradient(145deg,#111722,#0c111a);
border:1px solid #202b3b;border-radius:18px;
padding:22px;transition:.25s
}
.card:hover{transform:translateY(-4px);border-color:#00e5ff}
.card h3{margin-bottom:7px}
.card p{color:#9da9ba;font-size:14px;margin-bottom:12px}
input,textarea,select{
width:100%;padding:11px;margin:5px 0;
border-radius:9px;border:1px solid #303b4d;
background:#080c13;color:white;outline:none
}
textarea{min-height:100px;resize:vertical}
button{
width:100%;padding:11px;margin-top:7px;
border:0;border-radius:9px;background:#00e5ff;
color:#001014;font-weight:bold;cursor:pointer
}
button:hover{background:#52edff}
.result{
margin-top:10px;padding:10px;background:#080c13;
border-radius:8px;color:#00e5ff;word-wrap:break-word
}
#qrcode{text-align:center;margin-top:12px}
.about,.contact{
margin-top:50px;padding:28px;border:1px solid #202b3b;
border-radius:18px;background:#0e141e
}
.about h2,.contact h2{color:#00e5ff;margin-bottom:10px}
.contact{text-align:center}
.contact a{color:#00e5ff}
footer{
text-align:center;padding:28px;margin-top:40px;
border-top:1px solid #202938;color:#7f8b9d
}
footer strong{color:#00e5ff}
@media(max-width:600px){
.logo{font-size:30px}
nav{gap:14px;font-size:14px}
.section-title{font-size:25px}
}
</style>
</head>

<body>

<header id="home">
<div class="logo">🚀 <span>Deenu Kataria</span></div>
<p>Free & Useful Online Tools — Simple, Fast & Easy</p>
</header>

<nav>
<a href="#home">Home</a>
<a href="#tools">Tools</a>
<a href="#about">About</a>
<a href="#contact">Contact</a>
</nav>

<div class="container">

<h2 class="section-title" id="tools">🧰 <span>Online Tools</span></h2>

<div class="search-box">
<input id="toolSearch" onkeyup="searchTools()" placeholder="🔎 Find a Tool...">
</div>

<div class="tools">

<div class="card">
<h3>📝 Word Counter</h3>
<p>Count words and characters.</p>
<textarea id="wordText" oninput="wordCount()" placeholder="Type your text..."></textarea>
<div class="result" id="wordResult">Words: 0 | Characters: 0</div>
</div>

<div class="card">
<h3>🔤 Case Converter</h3>
<p>Convert text case.</p>
<textarea id="caseText" placeholder="Enter text..."></textarea>
<button onclick="upperCase()">UPPERCASE</button>
<button onclick="lowerCase()">lowercase</button>
<button onclick="titleCase()">Title Case</button>
</div>

<div class="card">
<h3>🎂 Age Calculator</h3>
<p>Calculate your age.</p>
<input type="date" id="birthDate">
<button onclick="ageCalc()">Calculate Age</button>
