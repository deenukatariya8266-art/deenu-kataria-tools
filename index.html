<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deenu Kataria Tools</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:#f8fafc;
}
header{
  text-align:center;
  padding:35px 15px;
  background:#111827;
}
header h1{margin:0;font-size:32px}
header p{color:#94a3b8}
nav{
  position:sticky;
  top:0;
  z-index:10;
  background:#020617;
  padding:14px;
  text-align:center;
}
nav a{
  color:#fff;
  text-decoration:none;
  margin:0 10px;
  font-weight:bold;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}
.search{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  margin-bottom:25px;
  font-size:16px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:18px;
}
.card{
  background:#1e293b;
  padding:20px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
}
.card h2{font-size:20px}
input,textarea,select{
  width:100%;
  padding:11px;
  margin:6px 0;
  border:0;
  border-radius:8px;
}
textarea{min-height:100px}
button{
  width:100%;
  padding:11px;
  margin-top:7px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}
.result{
  margin-top:10px;
  padding:10px;
  background:#0f172a;
  border-radius:8px;
  min-height:20px;
  word-wrap:break-word;
}
section{
  padding:35px 0;
}
footer{
  text-align:center;
  padding:30px;
  background:#020617;
  color:#94a3b8;
}
</style>
</head>

<body>

<header>
<h1>🚀 Deenu Kataria</h1>
<p>Free & Useful Online Tools — Simple, Fast & Easy</p>
</header>

<nav>
<a href="#home">Home</a>
<a href="#tools">Tools</a>
<a href="#about">About</a>
<a href="#contact">Contact</a>
</nav>

<div class="container">

<section id="home">
<h2>Welcome 👋</h2>
<p>Useful online tools — completely simple and easy to use.</p>
</section>

<section id="tools">
<h2>🛠️ All Tools</h2>
